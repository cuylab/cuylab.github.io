  description: Envisioned by our founder [Matias Quintana](https://cuylab.org/members/matias-quintana.html) and brought to life by the amazing local artist and tattooer [Wynn Gray](https://www.wynngray.com/), our research group mascot *CUY* is here! Paying homage to our founder's home country, Peru, and his upbringing, _cuy_ (pronounced koo-EE) is the word for guinea pig in Spanish and embodies the collaborative and hardworking attitude of our members!
