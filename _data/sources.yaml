# Manually curated publications, and per-paper overrides for works pulled from ORCID.
#
# Entries are merged into _data/citations.yaml by _cite/cite.py, matched on "id".
# An entry whose "id" matches an ORCID-sourced work overrides that work's fields.
# Setting "remove: true" on a matching id drops that work from the site.
#
# Example:
# - id: doi:10.1016/j.buildenv.2020.107144
#   image: images/photo.jpg
#   tags:
#     - thermal comfort
#   buttons:
#     - type: source
#       link: https://github.com/...

[]
