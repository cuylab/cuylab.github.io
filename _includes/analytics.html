<!--
  Web analytics: Google Analytics 4 + Microsoft Clarity.

  IDs are set in _config.yaml (analytics.google / analytics.clarity).
  Nothing is loaded until the visitor opts in through the cookie-consent
  banner — see _scripts/consent.js and _styles/consent.scss. When consent
  is granted, consent.js reads window.LAB_ANALYTICS below and injects the
  GA4 and Clarity tags. GA4 also runs in Consent Mode v2 (denied by
  default) so no cookies are set beforehand.
-->
{% assign ga = site.analytics.google %}
{% assign clarity = site.analytics.clarity %}
{% if ga != "" or clarity != "" %}
  <script>
    window.LAB_ANALYTICS = {
      ga: {% if ga != "" %}"{{ ga }}"{% else %}null{% endif %},
      clarity: {% if clarity != "" %}"{{ clarity }}"{% else %}null{% endif %},
    };
    {% if ga != "" %}
      // GA4 Consent Mode v2 — deny everything until the visitor opts in.
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        wait_for_update: 500,
      });
    {% endif %}
  </script>
{% endif %}
